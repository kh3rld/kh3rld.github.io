name: 🚀 Deploy Portfolio

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        fi
        
    - name: 🧪 Run accessibility tests
      run: |
        if command -v pa11y &> /dev/null; then
          pa11y http://localhost:8000 || true
        fi
        
    - name: 📊 Run performance tests
      run: |
        if command -v lighthouse &> /dev/null; then
          lighthouse http://localhost:8000 --output=json --output-path=./lighthouse-results.json || true
        fi

  build:
    name: 🏗️ Build Portfolio
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        fi
        
    - name: 🔧 Build project
      run: |
        # Minify CSS
        if command -v cleancss &> /dev/null; then
          find . -name "*.css" -not -path "./node_modules/*" -exec cleancss -o {}.min {} \;
        fi
        
        # Minify JavaScript
        if command -v uglifyjs &> /dev/null; then
          find . -name "*.js" -not -path "./node_modules/*" -exec uglifyjs -o {}.min {} \;
        fi
        
        # Optimize images
        if command -v imagemin &> /dev/null; then
          find . -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.svg" | \
          xargs -I {} imagemin {} --out-dir=./optimized
        fi
        
    - name: 📊 Generate sitemap
      run: |
        # Update sitemap with current date
        sed -i "s/<lastmod>.*<\/lastmod>/<lastmod>$(date +%Y-%m-%d)<\/lastmod>/g" sitemap.xml
        
    - name: 🗂️ Create build artifacts
      run: |
        mkdir -p build
        cp -r web/ build/
        cp -r *.html build/
        cp -r *.xml build/
        cp -r *.txt build/
        cp -r *.json build/
        
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portfolio-build
        path: build/

  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: portfolio-build
        path: build/
        
    - name: 🚀 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        cname: kh3rld.github.io
        
    - name: 📧 Notify deployment
      run: |
        echo "🚀 Portfolio deployed successfully!"
        echo "🌐 URL: https://kh3rld.github.io"
        echo "📊 Build completed at: $(date)"

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Run security audit
      run: |
        if [ -f package.json ]; then
          npm audit --audit-level=moderate || true
        fi
        
    - name: 🛡️ Check for vulnerabilities
      run: |
        # Check for common security issues
        if command -v safety &> /dev/null; then
          safety check || true
        fi
        
    - name: 🔐 Check secrets
      run: |
        # Check for accidentally committed secrets
        if command -v truffleHog &> /dev/null; then
          truffleHog filesystem . --no-verification || true
        fi

  performance:
    name: ⚡ Performance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Install Lighthouse
      run: npm install -g lighthouse
      
    - name: 🚀 Start local server
      run: |
        python3 -m http.server 8000 &
        sleep 5
        
    - name: 📊 Run Lighthouse audit
      run: |
        lighthouse http://localhost:8000 \
          --output=json \
          --output-path=./lighthouse-results.json \
          --chrome-flags="--headless" || true
          
    - name: 📈 Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: lighthouse-results.json

  accessibility:
    name: ♿ Accessibility Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Install pa11y
      run: npm install -g pa11y
      
    - name: 🚀 Start local server
      run: |
        python3 -m http.server 8000 &
        sleep 5
        
    - name: ♿ Run accessibility tests
      run: |
        pa11y http://localhost:8000 --reporter=json --output=pa11y-results.json || true
        
    - name: 📈 Upload accessibility results
      uses: actions/upload-artifact@v4
      with:
        name: pa11y-results
        path: pa11y-results.json

  seo:
    name: 🔍 SEO Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Install SEO tools
      run: |
        npm install -g lighthouse
        npm install -g pa11y
        
    - name: 🚀 Start local server
      run: |
        python3 -m http.server 8000 &
        sleep 5
        
    - name: 🔍 Check meta tags
      run: |
        # Check for required meta tags
        curl -s http://localhost:8000 | grep -q '<meta name="description"' || echo "Missing description meta tag"
        curl -s http://localhost:8000 | grep -q '<meta name="keywords"' || echo "Missing keywords meta tag"
        curl -s http://localhost:8000 | grep -q '<meta property="og:title"' || echo "Missing Open Graph title"
        curl -s http://localhost:8000 | grep -q '<meta property="og:description"' || echo "Missing Open Graph description"
        
    - name: 🗺️ Check sitemap
      run: |
        curl -s http://localhost:8000/sitemap.xml | grep -q '<?xml' || echo "Sitemap not found or invalid"
        
    - name: 🤖 Check robots.txt
      run: |
        curl -s http://localhost:8000/robots.txt | grep -q 'User-agent' || echo "Robots.txt not found or invalid"

  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy, security, performance, accessibility, seo]
    if: always()
    
    steps:
    - name: 🧹 Clean up artifacts
      run: |
        echo "Cleaning up build artifacts..."
        rm -rf build/ || true
        rm -f *.min.css || true
        rm -f *.min.js || true
        rm -f lighthouse-results.json || true
        rm -f pa11y-results.json || true
        
    - name: 📊 Generate deployment report
      run: |
        echo "## 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Checks Completed:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Tests" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Build" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Security Scan" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Performance Check" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Accessibility Check" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SEO Check" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Deployment" >> $GITHUB_STEP_SUMMARY
